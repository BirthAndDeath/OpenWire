name = "openwire-server"
compatibility_date = "2026-01-01"
main = "src/worker.mjs"

[durable_objects]
bindings = [
  { name = "RELAY_REGISTRY", class_name = "RelayRegistry" },
  { name = "PRESENCE", class_name = "Presence" },
  { name = "SIGNALING_ROOM", class_name = "SignalingRoom" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRegistry", "Presence", "SignalingRoom"]
[package]
name = "openwire_core"
version = "0.2.0"
edition = "2024"
publish = false
[features]
redb_dht = ["redb"]
[dependencies]
thiserror = "2"
libp2p = { workspace = true }
anyhow = "1.0.104"
futures = "0.3.34"
rootcell = { workspace = true }
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11"
hkdf = "0.13"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "macros"] }
tokio = { workspace = true }
tracing-appender = "0.2.5"
tracing = { workspace = true }
aes-gcm = "0.11.1"

aws-lc-rs = { version = "1.18", features = ["prebuilt-nasm"] }


hex = "0.4.3"
subtle = "2"
rand = "0.10.3"
if-addrs = "0.15"
lru = "0.18.5"

dashmap = "6"
redb = { version = "4.3.0", optional = true }
zeroize = { version = "1.9.0", features = ["zeroize_derive", "serde"] }
async-compression = { version = "0.4.50", features = ["futures-io", "zstd"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
libp2p-pathranker = { path = "../libp2p-pathranker" }
serde_json = "1"


[dev-dependencies]
did-key = "0.2.1"
[package.metadata.docs.rs]
#no-deps = true

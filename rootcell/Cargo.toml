[package]
name = "rootcell"
version = "0.3.0"
edition = "2021"

[features]
default = []

[dependencies]
zeroize = { version = "1.9", features = ["zeroize_derive"] }
anyhow = "1.0"
hex = "0.4.3"
tracing = "0.1"
aes-gcm = "0.11.0"
blake3 = "1.8.6"
rand = "0.10.2"
hkdf = "0.13"
sha2 = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

keyring = { version = "4.1.6" }
keyring-core = "1.0.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = "1.0.1"
libc = "0.2.189"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
ndk-context = "0.1.1"
libc = "0.2.189"

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = "1.0.1"
libc = "0.2.189"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
libc = "0.2.189"
zbus-secret-service-keyring-store = "1.0.0"

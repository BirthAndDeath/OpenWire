[package]
name = "rootcell"
version = "0.3.0"
description = "Cross-platform identity and keyring primitives for PQC messaging"
license = "AGPL-3.0"
repository = "https://github.com/BirthAndDeath/OpenWire"
edition = "2021"

[features]
default = []

[dependencies]
zeroize = { version = "1.9", features = ["zeroize_derive"] }
anyhow = "1.0"
hex = "0.4.3"
tracing = "0.1"
aes-gcm = "0.11.1"
blake3 = "1.8.7"
rand = "0.10.3"
hkdf = "0.13"
sha2 = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

keyring-core = "1.0.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
libc = "0.2.190"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
libc = "0.2.190"

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }
libc = "0.2.190"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
libc = "0.2.190"
zbus-secret-service-keyring-store = "1.0.1"
secret-service = { version = "5.2.0", features = ["rt-tokio-crypto-rust"], default-features = false }

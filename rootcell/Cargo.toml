[package]
name = "rootcell"
version = "0.1.0"
edition = "2021"

[features]
default = []
# 启用 WebAuthn 硬件支持（包含软件令牌）
hardware-auth = ["dep:webauthn-authenticator-rs", "dep:webauthn-rs-proto"]
# 启用 USB HID 硬件密钥支持（YubiKey 等）
usb-hid = ["hardware-auth", "webauthn-authenticator-rs/u2fhid"]
# 强制生产环境使用硬件（禁用软件回退）
force-hardware = []
tokio = ["dep:tokio"]


[dependencies]
# 加密
aes-gcm = "0.10"
x25519-dalek = { version = "2.0", features = ["reusable_secrets", "getrandom"] }
getrandom = "0.2"
rand = "0.8"
hkdf = "0.12"
sha2 = "0.10"

# 序列化
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }

# 安全内存
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# 错误处理
thiserror = "1.0"

# WebAuthn（可选）
webauthn-authenticator-rs = { version = "0.5", optional = true }
webauthn-rs-proto = { version = "0.5", optional = true }
async-trait = { version = "0.1" }

# 异步运行时（测试用）
tokio = { version = "1.49", features = ["rt-multi-thread", "macros"], optional = true }

[dev-dependencies]
tokio = { version = "1.49", features = ["rt-multi-thread", "macros"] }

[[test]]
name = "integration"
required-features = ["hardware-auth"]

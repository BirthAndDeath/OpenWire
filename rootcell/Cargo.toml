[package]
name = "rootcell"
version = "0.1.0"
edition = "2021"

[features]
default = []


[dependencies]
# 序列化
# postcard = { version = "1.1", features = ["alloc"] }  # 未使用，删除
# serde = { version = "1.0", features = ["derive"] }  # 未使用，删除

# 安全内存
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# 错误处理
# thiserror = "2.0"  # 未使用，删除
anyhow = "1.0"

# Keyring支持
keyring = { version = "3.6.3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }

# Hex编码
hex = "0.4.3"

# 日志
tracing = "0.1"

# Unix mlock支持
[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

# Windows VirtualLock支持
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }


# 异步运行时（测试用）
tokio = { version = "1.52", features = [
    "rt-multi-thread",
    "macros",
], optional = true }

[dev-dependencies]
# tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }  # 未使用，删除

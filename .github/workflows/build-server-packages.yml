name: "build-server-packages"
on:
  workflow_dispatch:
  push:
    branches:
      - release
      - nightly

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-deb:
    name: "DEB (${{ matrix.platform }})"
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-22.04-arm"
            target: "aarch64-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: install dependencies (ubuntu arm only)
        if: matrix.platform == 'ubuntu-22.04-arm'
        timeout-minutes: 15
        run: |
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=180
          sudo apt-get install -y libgtk-3-dev:arm64 pkg-config

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            . -> target
            openwire_core
            rootcell
            openwire_cli
            openwire_server
          cache-targets: "true"
          cache-all-crates: "true"
          cache-bin: "true"
          cache-on-failure: "true"

      - name: install cargo-deb
        run: cargo install cargo-deb --locked

      - name: build server .deb
        run: cargo deb -p openwire-server-cli --target ${{ matrix.target }}

      - name: upload .deb artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: openwire-server-cli-deb-${{ matrix.target }}
          path: target/${{ matrix.target }}/debian/*.deb

  build-rpm:
    name: "RPM (${{ matrix.target }})"
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-22.04-arm"
            target: "aarch64-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: install dependencies (ubuntu arm only)
        if: matrix.platform == 'ubuntu-22.04-arm'
        timeout-minutes: 15
        run: |
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=180
          sudo apt-get install -y libgtk-3-dev:arm64 pkg-config

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            . -> target
            openwire_core
            rootcell
            openwire_cli
            openwire_server
          cache-targets: "true"
          cache-all-crates: "true"
          cache-bin: "true"
          cache-on-failure: "true"

      - name: install rpmbuild and cargo-generate-rpm
        run: |
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=180
          sudo apt-get install -y rpm
          cargo install cargo-generate-rpm --locked

      - name: build server .rpm
        run: |
          cargo build --release -p openwire-server-cli --target ${{ matrix.target }}
          cargo generate-rpm -p openwire_server/server_cli --target ${{ matrix.target }}

      - name: upload .rpm artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: openwire-server-cli-rpm-${{ matrix.target }}
          path: target/${{ matrix.target }}/generate-rpm/*.rpm

  # 发布：等待全部构建 job 成功，汇总所有 deb/rpm 后一次性创建 release。
  # 避免各矩阵 job 抢建同一 tag_name 导致竞态（仅一个成功、release 缺包）。
  publish:
    name: "Publish server release"
    if: github.ref == 'refs/heads/release' || github.ref == 'refs/heads/nightly'
    needs: [build-deb, build-rpm]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: generate release metadata
        id: release_meta
        run: |
          TS="${{ github.event.push.head_commit.timestamp }}"
          if [ -z "$TS" ]; then TS=$(date -u +%Y%m%d%H%M%S); else TS=$(date -u -d "$TS" +%Y%m%d%H%M%S); fi
          echo "version=server-${{ github.ref_name }}-$TS" >> "$GITHUB_OUTPUT"

      - name: download all server packages
        uses: actions/download-artifact@v6.0.0
        with:
          path: packages
          merge-multiple: true

      - name: create GitHub release (all deb/rpm)
        uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: ${{ steps.release_meta.outputs.version }}
          name: ${{ steps.release_meta.outputs.version }}
          files: |
            packages/*.deb
            packages/*.rpm
          draft: true
          generate_release_notes: true

  # build-snap: 暂未注册 snap store 包名，待准备就绪后启用
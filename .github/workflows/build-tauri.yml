name: "publish-tauri"
on:
  workflow_dispatch:
  push:
    branches:
      - release
      - nightly

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  publish-tauri:
    permissions:
      contents: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "ubuntu-22.04-arm"
            args: ""
          - platform: "windows-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: "--apk"
            mobile: "android"
          - platform: "macos-latest"
            args: "--target aarch64-apple-ios"
            mobile: "ios"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' && !matrix.mobile
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: install dependencies (ubuntu arm only)
        if: matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev:arm64 libwebkit2gtk-4.1-dev:arm64 libappindicator3-dev:arm64 librsvg2-dev:arm64 patchelf pkg-config xdg-utils
      - name: install dependencies (android)
        if: matrix.mobile == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: setup java (android)
        if: matrix.mobile == 'android'
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: 17
      - name: install Android SDK/NDK
        if: matrix.mobile == 'android'
        env:
          ANDROID_HOME: "${{ runner.temp }}/android-sdk"
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: setup node
        uses: actions/setup-node@v7.0.0
        with:
          cache-dependency-path: "./openwire/package-lock.json"
          node-version: lts/*
          cache: "npm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && !matrix.mobile &&
            'aarch64-apple-darwin,x86_64-apple-darwin' ||
            matrix.mobile == 'android' && 'aarch64-linux-android' ||
            matrix.mobile == 'ios' && 'aarch64-apple-ios' || '' }}

      # Rust cache 必须在 workspace 根目录执行，才能正确缓存所有 workspace 成员
      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            . -> openwire/src-tauri/target
            openwire_core
            rootcell
            openwire_cli
          cache-targets: "true"
          cache-all-crates: "true"
          cache-bin: "true"
          cache-on-failure: "true"

      - name: decode keystore
        if: matrix.mobile == 'android' && env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ${{ runner.temp }}/upload-keystore.jks
      - name: fail if keystore missing
        if: matrix.mobile == 'android' && env.ANDROID_KEYSTORE_BASE64 == ''
        run: exit 1
        shell: bash

      - name: install frontend dependencies
        working-directory: ./openwire
        run: npm ci
      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_ANDROID_SIGNING_KEY_STORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        with:
          projectPath: "./openwire/src-tauri"
          tagName: "app-v__VERSION__"
          releaseName: "App v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          mobile: ${{ matrix.mobile }}
          args: ${{ matrix.args }}

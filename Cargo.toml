[workspace]
members = [
    "chat_core",
    "rootcell",
    "chat_cli",
    "chat_tauri/src-tauri",
    "chat_dioxus/packages/*",
]
resolver = "3"

[workspace.dependencies]
dioxus = { version = "0.7.4" }
# workspace dependencies
ui = { path = "chat_dioxus/packages/ui" }
rootcell = { path = "rootcell" }
chat_core = { path = "chat_core" }
tokio = { version = "1.50.0", features = ["full"] }  
tracing = "0.1.44"
[profile.dev]
incremental = true  # Compile your binary in smaller steps.
lto = false

[profile.release]
codegen-units = 1        # Allow LLVM to perform better optimizations.
lto = true               # Enable Link Time Optimization.
opt-level = 's'          # 's' prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort"          # Improve performance by disabling panic handlers.
strip = true             # Ensure debug symbols are removed.
debug = false            # No debug symbols (or limited)
debug-assertions = false
overflow-checks = true   # Keep overflow checks (security critical)
rpath = false

[profile.hot]
inherits = "release"

[profile.pgo]
inherits = "release"


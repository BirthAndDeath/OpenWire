[workspace]
members = [
    "chat_core",
    "rootcell",
    "cli",
    "chat_tauri/src-tauri",
    "chat_dixious/packages/*",
]
resolver = "3"
[workspace.dependencies]
dioxus = { version = "0.7.1" }

# workspace
ui = { path = "chat_dixious/packages/ui" }
rootcell = { path = "rootcell" }
chat_core = { path = "chat_core" }
tokio = { version = "1.49.0", features = ["full"] }
[profile.dev]
incremental = true # 以较小的步骤编译您的二进制文件。
lto = false

[profile.release]
codegen-units = 1        # 允许 LLVM 执行更好的优化。
lto = true               # 启用链接时优化。
opt-level = 's'          # 's'优先考虑小的二进制文件大小。如果您更喜欢速度，请使用 `3`。
panic = "abort"          # 通过禁用 panic 处理程序来提高性能。
strip = true             # 确保移除调试符号。
debug = false            # 无调试符号（或 limited）
debug-assertions = false
overflow-checks = true   # 保持溢出检查（安全关键）
rpath = false
[profile.hot]
inherits = "release"

[profile.pgo]
inherits = "release"

[workspace]
members = [
    "chat_core",
    "rootcell",
    "chat_cli",
    "chat_tauri/src-tauri",
    "chat_dioxus/packages/*",
]
resolver = "3"

[workspace.dependencies]
dioxus = { version = "0.7.4" }

ui = { path = "chat_dioxus/packages/ui" }
rootcell = { path = "rootcell" }
chat_core = { path = "chat_core" }
tokio = { version = "1.51.0", features = ["full"] }
tracing = "0.1.44"
[profile.dev]
incremental = true
lto = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
debug = false
debug-assertions = false
overflow-checks = true
rpath = false


[profile.flame]
inherits = "release"
opt-level = 3
strip = false
debug = true
lto = "thin"

[package]
name = "openwire"
version = "0.1.0"
description = "OpenWire - P2P Chat Application"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openwire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = ["isolation"] }

[dependencies]
tokio = { workspace = true }
openwire_core = { workspace = true }
rootcell = { workspace = true }
tracing = { workspace = true }
tauri = { version = "2.11.5", features = ["isolation"] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.4.3"
hex = "0.4.3"
postcard = "1.1.3"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1.1"
android-native-keyring-store = "1.0.0"

[package.metadata.docs.rs]
no-deps = true

[package]
name = "openwire"
version = "0.2.0"
description = "OpenWire - P2P Chat Application"
authors = ["you"]
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openwire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = ["isolation"] }

[dependencies]
tokio = { workspace = true }
openwire_core = { workspace = true }
rootcell = { workspace = true }
tracing = { workspace = true }
# 关闭默认 features（tauri 默认含 compression，会拉入 brotli 运行时依赖，
# 使 exe 增大约 1-2MB）；前端产物仅约 523KB，压缩收益 <100KB 可忽略。
# 显式保留功能所需：wry（桌面 webview）、common-controls-v6（Windows 控件）、
# tray-icon、protocol-asset（自定义协议）、isolation（脚本隔离，安全必需）
tauri = { version = "2.12.1", default-features = false, features = [
    "wry",
    "common-controls-v6",
    "tray-icon",
    "protocol-asset",
    "isolation",
] }
tauri-plugin-opener = "2.7.0"
tauri-plugin-rootcell = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.5.0"
hex = "0.4.3"
postcard = "1.1.3"
libp2p = { workspace = true }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[package.metadata.docs.rs]
no-deps = true

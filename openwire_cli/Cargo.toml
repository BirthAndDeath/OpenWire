[package]
name = "openwire_cli"
version = "0.1.0"
edition = "2024"


[dependencies]
thiserror = "2"
openwire_core = { workspace = true }
tokio = { workspace = true }
clap = { version = "4.6", features = ["derive"] }
serde_json = "1.0.150"
chrono = { version = "0.4", features = ["serde"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.32"
ratatui = "0.30.2"
arboard = "3.6"
etcetera = "0.11.0"
rootcell = { workspace = true }
hex = "0.4.3"
[package.metadata.docs.rs]
# docs.rs 构建时使用
no-deps = true
